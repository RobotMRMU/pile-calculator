<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>混凝土标号对比 | 工程工具箱</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 计算器样式 */
        .calculator-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .calc-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 16px;
            text-align: center;
        }
        .calc-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }
        .calc-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .calc-group label {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }
        .calc-input {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        .calc-input:focus {
            border-color: #3b82f6;
        }
        .calc-result {
            background: #f3f4f6;
            padding: 14px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: #1f2937;
            font-size: 15px;
        }
        .calc-note {
            font-size: 12px;
            color: #6b7280;
            margin-top: 10px;
            line-height: 1.5;
            text-align: center;
        }

        /* 两列表格样式 */
        .table-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 30px 0 15px;
            color: #2c3e50;
        }
        .concrete-table {
            width: 60%;
            margin: 0 auto 20px;
            border-collapse: collapse;
            background: #fff;
        }
        .concrete-table th,
        .concrete-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .concrete-table th {
            background: #f8f9fa;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 导航栏（完全不变，跳转正常） -->
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">工程工具箱</a>
            <button class="nav-toggle" onclick="toggleMenu()">☰</button>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">桩基计算</a>
                <a href="unit-converter.html" class="nav-link">单位转换</a>
                <a href="concrete-grade.html" class="nav-link active">混凝土标号</a>
                <a href="about.html" class="nav-link">关于</a>
            </div>
        </div>
    </nav>

    <div class="page-title">中美混凝土强度换算对照</div>
    <div class="page-subtitle">按工程标准制作</div>

    <!-- 双向换算计算器 -->
    <div class="card calculator-card">
        <div class="calc-title">混凝土强度双向换算器</div>
        <div class="calc-row">
            <div class="calc-group">
                <label>中国立方体强度 fcu,k (MPa)</label>
                <input type="number" class="calc-input" id="cnStrength" placeholder="输入数值" step="0.1">
            </div>
            <div class="calc-group">
                <label>美国圆柱体强度 f'c (MPa)</label>
                <input type="number" class="calc-input" id="usStrength" placeholder="输入数值" step="0.1">
            </div>
        </div>
        <div class="calc-result" id="calcResult">请输入数值开始换算</div>
        <div class="calc-note">
            中国标准 150mm 立方体强度 ↔ 美国标准 150×300mm 圆柱体强度<br>
            换算关系：f'c ≈ 0.79 × fcu,k
        </div>
    </div>

    <!-- 仅2列：美标圆柱体MPa | 中国立方体MPa -->
    <h3 class="table-title">混凝土强度对应表</h3>
    <table class="concrete-table">
        <tr>
            <th>美国圆柱体强度 (MPa)</th>
            <th>中国立方体强度 (MPa)</th>
        </tr>
        <tr>
            <td>8</td><td>10</td>
        </tr>
        <tr>
            <td>12</td><td>15</td>
        </tr>
        <tr>
            <td>20</td><td>25</td>
        </tr>
        <tr>
            <td>25</td><td>30</td>
        </tr>
        <tr>
            <td>30</td><td>37</td>
        </tr>
        <tr>
            <td>35</td><td>45</td>
        </tr>
        <tr>
            <td>40</td><td>50</td>
        </tr>
    </table>

    <script src="script.js"></script>
    <script>
        // 双向换算逻辑（按规范：0.79系数）
        function initCalculator() {
            const cnInput = document.getElementById('cnStrength');
            const usInput = document.getElementById('usStrength');
            const result = document.getElementById('calcResult');

            function cnToUs() {
                const val = parseFloat(cnInput.value);
                if (isNaN(val)) {
                    usInput.value = '';
                    result.textContent = '请输入有效数值';
                    return;
                }
                const res = (val * 0.79).toFixed(2);
                usInput.value = res;
                result.textContent = `${val} MPa（中国立方体）= ${res} MPa（美国圆柱体）`;
            }

            function usToCn() {
                const val = parseFloat(usInput.value);
                if (isNaN(val)) {
                    cnInput.value = '';
                    result.textContent = '请输入有效数值';
                    return;
                }
                const res = (val / 0.79).toFixed(2);
                cnInput.value = res;
                result.textContent = `${val} MPa（美国圆柱体）= ${res} MPa（中国立方体）`;
            }

            cnInput.addEventListener('input', cnToUs);
            usInput.addEventListener('input', usToCn);
        }

        document.addEventListener('DOMContentLoaded', function() {
            initCalculator();
        });
    </script>
</body>
</html>
